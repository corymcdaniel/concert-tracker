<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cory's Show Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a running ticket-stub ledger, grouped by year, with a stats strip up top and an edit sheet that slides in */
:root{
  --bg:#e9ecf1; --paper:#fbfcfd; --ink:#16192b; --muted:#646a82; --line:#cdd2dd;
  --music:#2a46e8; --comedy:#c4176b; --upcoming:#0f8a5f; --chip:#dfe3ec;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1019; --paper:#171a27; --ink:#e7e9f2; --muted:#9097b1; --line:#2c3145;
  --music:#7d93ff; --comedy:#ff6aae; --upcoming:#45d19c; --chip:#242838; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1019; --paper:#171a27; --ink:#e7e9f2; --muted:#9097b1; --line:#2c3145;
  --music:#7d93ff; --comedy:#ff6aae; --upcoming:#45d19c; --chip:#242838; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,68px);line-height:.9;letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 small{display:block;font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.save-state{font-family:var(--mono);font-size:12px;color:var(--muted)}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px}
button:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--music);outline-offset:2px}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
button.danger{color:var(--comedy);border-color:var(--comedy)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:2px solid var(--ink)}
.stat{padding:12px 14px;border-left:1px dashed var(--line)}
.stat:first-child{border-left:0}
.stat b{display:block;font-family:var(--display);font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px dashed var(--line)}}

.most{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.most .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{background:var(--chip);border:0;border-radius:999px;padding:3px 10px;font-size:13px}
.chip em{font-style:normal;font-family:var(--mono);color:var(--muted);margin-left:4px}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 12px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink);position:relative}
.tabs button{border:0;border-radius:6px 6px 0 0;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;padding:6px 16px 4px;background:none;color:var(--muted);width:112px;position:relative;z-index:1}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--paper)}
/* the selected tab's background is one shape that slides between the equal-width tabs */
.tab-ink{position:absolute;left:0;top:0;bottom:0;width:112px;border-radius:6px 6px 0 0;background:var(--ink)}
.tabs:has([data-view=stats][aria-selected=true]) .tab-ink{transform:translateX(calc(100% + 2px))}
@supports not selector(:has(*)){.tab-ink{display:none}.tabs button[aria-selected=true]{background:var(--ink)}}
.most button.more{background:none;border:1px dashed var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}
.sv{display:grid;gap:28px}
.panel h3{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;gap:8px}
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.hl div{background:var(--paper);border-radius:8px;padding:12px 14px;display:grid;gap:2px;align-content:start}
.hl b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.05}
.hl span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hl p{margin:0;font-size:13px;color:var(--muted)}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end;gap:3px;height:150px;padding-top:16px;overflow-x:auto}
.bars .col{display:grid;grid-template-rows:auto 1fr auto;height:100%;min-width:18px;text-align:center}
.bars .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.bars .stack{display:flex;flex-direction:column;justify-content:flex-end}
.bars .seg-m{background:var(--music)}.bars .seg-c{background:var(--comedy)}
.bars .stack>div:first-child{border-radius:3px 3px 0 0}
.bars .x{font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:4px;white-space:nowrap}
.bars .zero .x{opacity:.6}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);font-family:var(--body);text-transform:none;letter-spacing:0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:680px){.two{grid-template-columns:1fr}}
.rank{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:14px}
.rank .lab{min-width:0;position:relative;padding:3px 8px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rank .lab::before{content:"";position:absolute;inset:0;width:var(--w);background:var(--chip);z-index:-1}
.rank .lab{isolation:isolate}
.rank .c{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.era{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--paper);border-radius:8px;overflow:hidden}
.era>div{padding:14px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.era>div+div{border-left:2px dashed var(--line)}
.era h4{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-transform:uppercase}
.era .rng{font-family:var(--mono);font-size:12px;color:var(--muted)}
.era dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.era dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.era dd{margin:0;min-width:0;font-variant-numeric:tabular-nums}
.era dd b{font-family:var(--display);font-size:22px;font-weight:800}
.era .up{color:var(--upcoming);font-family:var(--mono);font-size:12px}
.era .dn{color:var(--comedy);font-family:var(--mono);font-size:12px}
.both{margin-top:10px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.both .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.movectl{display:flex;align-items:center;gap:8px;font-family:var(--body);font-size:13px;text-transform:none;letter-spacing:0}
.movectl input{padding:4px 8px;font-size:13px}
@media (max-width:560px){.era{grid-template-columns:1fr}.era>div+div{border-left:0;border-top:2px dashed var(--line)}}
.tbl-wrap{overflow-x:auto}
table.rep{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.rep th{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink)}
table.rep td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rep td.num,table.rep th.num{text-align:right;font-family:var(--mono)}
table.rep button{border:0;background:none;padding:0;font-weight:600;text-align:left}
table.rep button:hover{color:var(--music);text-decoration:underline}
.year{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.year h2{font-family:var(--display);font-weight:800;font-size:44px;margin:0;line-height:1}
.year span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.year::after{content:"";flex:1;border-top:2px solid var(--ink);align-self:center}
.year.next h2{color:var(--upcoming);text-transform:uppercase}
.year.next::after{border-top-color:var(--upcoming)}
.list{display:grid;gap:10px}

.stub{display:grid;grid-template-columns:104px 1fr;border-radius:8px;position:relative;overflow:hidden}
.stub .date,.stub .body{background:var(--paper)}
.stub .date{padding:14px 12px;border-right:2px dashed var(--line);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;position:relative}
.stub .date .m{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stub .date .d{font-family:var(--display);font-size:40px;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
.stub .date .y{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stub .date::before,.stub .date::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.stub .date::before{top:-8px}.stub .date::after{bottom:-8px}
.stub .body{padding:12px 16px;min-width:0;display:grid;gap:6px}
.where{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px;color:var(--muted)}
.where strong{color:var(--ink);font-weight:600;font-size:14px}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid currentColor}
.tag.music{color:var(--music)}.tag.comedy{color:var(--comedy)}.tag.up{color:var(--upcoming)}
.acts{display:flex;flex-wrap:wrap;gap:4px 6px;margin:0;padding:0;list-style:none}
.acts button{border:0;background:none;padding:2px 0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1;text-align:left;border-radius:3px}
.acts button:hover{color:var(--music);text-decoration:underline;text-underline-offset:3px}
.acts li:not(:last-child)::after{content:"/";font-family:var(--display);font-size:22px;color:var(--line);margin-left:6px}
.acts li.first button{font-weight:800}
body.readonly .edit-only{display:none}
.notes{font-size:13px;color:var(--muted);font-style:italic}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.add-act{font-family:var(--mono);font-size:11px;padding:3px 8px;color:var(--muted);border-style:dashed}
/* billing order sheet */
.bill-for{font-size:14px;margin:-6px 0 4px}
.bill{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:bill}
.bill li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--paper);counter-increment:bill}
.bill li::before{content:counter(bill);font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.bill .name{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1;overflow-wrap:anywhere}
.bill li:first-child{border-color:var(--ink)}
.bill li:first-child .name{font-weight:800}
.bill .ctl{display:flex;gap:4px;align-items:center}
.bill .ctl button{padding:3px 8px;font-size:13px}
.bill .star{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--upcoming)}
@media (prefers-reduced-motion:no-preference){.bill li.moved{animation:rise .2s var(--ease)}}
.stub.is-up{outline:2px solid var(--upcoming);outline-offset:-2px}
@media (max-width:480px){.stub{grid-template-columns:78px 1fr}.stub .date .d{font-size:32px}.acts button{font-size:19px}}
.empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:8px}

/* info modal */
.where .vbtn{border:0;background:none;padding:0;font:inherit;font-weight:600;font-size:14px;color:var(--ink);text-align:left}
.where .vbtn:hover,.rank .lab button:hover{color:var(--music);text-decoration:underline;text-underline-offset:3px}
.rank .lab button{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.info{position:fixed;z-index:21;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--paper);border-radius:12px;box-shadow:0 24px 60px rgb(0 0 0 / .35);display:grid}
.info .hero{position:relative;background:var(--chip);aspect-ratio:16/9;max-width:100%;overflow:hidden}
.info .hero img{width:100%;height:100%;object-fit:cover;display:block}
.info .hero .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:96px;color:var(--line);text-transform:uppercase}
/* initials are only a placeholder: gone once the photo has loaded (kept if it fails) */
.info .hero.loaded .ph{opacity:0;visibility:hidden}
.info .hero img{opacity:0}
.info .hero.loaded img{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .info .hero img{transition:opacity .25s var(--ease)}
  .info .hero .ph{transition:opacity .2s var(--ease),visibility .2s}
}
.info .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;padding:0;background:rgb(10 12 20 / .55);color:#fff;border:0;font-size:20px;line-height:1}
.info .credit{position:absolute;left:0;right:0;bottom:0;padding:16px 12px 6px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgb(0 0 0 / .6));text-align:right}
.info .credit a{color:#fff}
.info .ib{padding:18px 20px 22px;display:grid;gap:14px;min-width:0}
.info h2{font-family:var(--display);font-weight:800;font-size:clamp(32px,7vw,46px);line-height:.95;margin:0;text-transform:uppercase;text-wrap:balance}
.info .desc{color:var(--muted);margin-top:4px}
.info .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 16px;margin:0}
.info .facts div{min-width:0}
.info .facts dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.info .facts dd{margin:2px 0 0;overflow-wrap:anywhere}
.info .sum{font-size:14.5px;line-height:1.55;max-width:65ch}
.info .sum.loading{color:var(--muted)}
.info .note{background:var(--chip);border-radius:6px;padding:8px 10px;font-size:13px}
.info .seen h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.info .seen ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.info .seen li{display:grid;grid-template-columns:96px 1fr;gap:10px;font-variant-numeric:tabular-nums}
.info .seen li span:first-child{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:1px}
.info .seen.next h4,.info .seen.next li span:first-child{color:var(--upcoming)}
.info .links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.info .links a{color:var(--music)}
.info .links .spacer{flex:1}
/* edit sheet */
.scrim{position:fixed;inset:0;background:rgb(10 12 20 / .45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);z-index:21;display:flex;flex-direction:column;
  padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));box-shadow:-12px 0 40px rgb(0 0 0 / .2);overflow:auto}
.sheet h3{font-family:var(--display);font-size:34px;font-weight:800;margin:0 0 14px;text-transform:uppercase}
.sheet form{display:grid;gap:12px}
.sheet label{display:grid;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sheet label input,.sheet label select,.sheet label textarea{font-family:var(--body);font-size:15px;letter-spacing:0;text-transform:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-family:var(--body);font-size:12px;text-transform:none;letter-spacing:0;color:var(--muted)}
.sheet .foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center}
.sheet .foot .spacer{flex:1}
.confirm{background:var(--chip);border-radius:6px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
textarea.json{width:100%;min-height:260px;font-family:var(--mono);font-size:12px}
/* history sheet */
.history-for{font-size:14px;margin:-6px 0 4px}
.history{list-style:none;margin:0 0 4px;padding:0;display:grid;gap:10px}
.history .change{border:1px solid var(--line);border-left:4px solid var(--music);border-radius:6px;padding:10px 12px;display:grid;gap:6px;transition:border-color .15s,transform .15s}
.history .change:hover{border-color:var(--muted);transform:translateX(-2px)}
.history .change.insert{border-left-color:var(--upcoming)}
.history .change.delete{border-left-color:var(--comedy)}
.history .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.history .verb{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.history .what{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.history .head button{padding:2px 10px;font-size:13px}
.history .tag{font-family:var(--mono);font-size:11px;background:var(--chip);border-radius:4px;padding:2px 8px;color:var(--muted)}
.history .diff{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13px}
.history .diff li{display:grid;grid-template-columns:96px 1fr;gap:8px}
.history .diff .f{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:1px}
.history .diff del{color:var(--muted)}
.history .diff ins{text-decoration:none;font-weight:600}
.history .diff .arrow{color:var(--muted)}
.history .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:6px;z-index:30;font-size:14px}

/* ---------- motion ----------
   Subtle and quick: 150–250ms, small distances. Everything here is skipped for
   prefers-reduced-motion, and the JS (hide(), countTo(), watchReveals()) checks it too. */
:root{--ease:cubic-bezier(.2,.7,.3,1)}
.stub .date{z-index:1} /* keep the perforation notches above the body when it shifts */
@media (prefers-reduced-motion:no-preference){
  /* stubs fade up as they scroll into view */
  .stub{transition:opacity .25s var(--ease),transform .25s var(--ease),box-shadow .2s var(--ease)}
  .stub.reveal{opacity:0;transform:translateY(8px)}
  .list.swap{animation:dim .18s var(--ease)}
  /* sheets, pop-ups, backdrop and toast animate in and out */
  .sheet{animation:slide .2s var(--ease)}
  .sheet.closing{animation:slide-out .16s ease-in forwards}
  .info{animation:pop-in .2s var(--ease)}
  .info.closing{animation:pop-out .15s ease-in forwards}
  .scrim{animation:fade-in .2s var(--ease)}
  .scrim.closing{animation:fade-out .16s ease-in forwards}
  .toast.pop{animation:toast-in .2s var(--ease)}
  .toast.closing{animation:fade-out .2s ease-in forwards}
  .history .change{animation:rise .2s var(--ease) both}
  /* views and stats */
  .sv>*{animation:rise .25s var(--ease) both}
  .sv>:nth-child(2){animation-delay:30ms}.sv>:nth-child(3){animation-delay:60ms}
  .sv>:nth-child(4){animation-delay:90ms}.sv>:nth-child(n+5){animation-delay:120ms}
  .bars .stack>div{transform-origin:bottom;animation:grow-y .45s var(--ease) both}
  .rank .lab::before{transform-origin:left;animation:grow-x .45s var(--ease) both}
  /* controls */
  button{transition:background-color .15s,border-color .15s,color .15s,transform .1s}
  button:active{transform:scale(.97)}
  .tab-ink{transition:transform .25s var(--ease)}
  .tabs button{transition:color .2s var(--ease)}
}
/* hover: stubs lift, and the ticket "tears" a little along the perforation */
@media (prefers-reduced-motion:no-preference) and (hover:hover){
  .stub .body{transform-origin:left center;transition:transform .2s var(--ease)}
  .stub:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgb(0 0 0 / .1)}
  .stub:hover .body{transform:translateX(3px) rotate(.4deg)}
}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
@keyframes slide-out{to{transform:translateX(30px);opacity:0}}
@keyframes pop-in{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}}
@keyframes pop-out{to{opacity:0;transform:translate(-50%,-49%) scale(.98)}}
@keyframes fade-in{from{opacity:0}}
@keyframes fade-out{to{opacity:0}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,6px)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes dim{from{opacity:.35}}
@keyframes grow-y{from{transform:scaleY(0)}}
@keyframes grow-x{from{transform:scaleX(0)}}
</style>

<script>
(() => {
const KEY = 'show-log-v2';
const API = '/api/shows';
const TODAY = (d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)(new Date());
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let showAllMost = false, view = 'log';
let shows = [], mode = 'local', filt = {q:'', type:'', city:''};

const $ = s => document.querySelector(s);
const PLACES = {"Phoenix": ["AZ", "US"], "Tempe": ["AZ", "US"], "San Diego": ["CA", "US"], "Atlanta": ["GA", "US"], "Brooklyn": ["NY", "US"], "New York": ["NY", "US"], "Chicago": ["IL", "US"], "Detroit": ["MI", "US"], "Grand Rapids": ["MI", "US"], "Toronto": ["ON", "Canada"], "Osaka": ["Osaka", "Japan"]};
const withPlace = s => { const p = PLACES[s.city]; return {...s, state: s.state ?? (p?p[0]:''), country: s.country || (p?p[1]:'US')}; };
const place = o => !o.city ? '' : o.country && o.country !== 'US' ? `${o.city}, ${o.state && o.state!==o.city ? o.state+', ' : ''}${o.country}` : o.state ? `${o.city}, ${o.state}` : o.city;
const cityKey = o => place(o);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };
const newId = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
// a show counts toward stats the day after it happens; undated shows are in the past
const happened = s => !s.date || s.date < TODAY;

/* ---------- motion ---------- */
const motionOK = () => !matchMedia('(prefers-reduced-motion: reduce)').matches;
// open = shown and not on its way out
const isOpen = el => !el.hidden && !el.classList.contains('closing');
function show(el){ el.classList.remove('closing'); el.hidden = false; }
// Plays the element's .closing animation, then hides it. Showing it again meanwhile cancels the hide.
function hide(el){
  if (!isOpen(el)) return;
  if (!motionOK()) { el.hidden = true; return; }
  el.classList.add('closing');
  el.addEventListener('animationend', function done(e){
    if (e.target !== el) return;
    el.removeEventListener('animationend', done);
    if (!el.classList.contains('closing')) return;
    el.classList.remove('closing'); el.hidden = true;
  });
}
// Restart a CSS animation class on an element that's already showing
function replay(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function toast(msg){ const t=$('#toast'); t.textContent=msg; show(t); replay(t,'pop'); clearTimeout(toast.h); toast.h=setTimeout(()=>hide(t),2200); }


async function load(){ await loadRaw(); shows = shows.map(withPlace); }
async function loadRaw(){
  try {
    const r = await fetch(API, {cache:'no-store'});
    if (r.ok && (r.headers.get('content-type')||'').includes('json')) { const d = await r.json(); if (Array.isArray(d)) { shows = d; mode='netlify'; return; } }
  } catch {}
  const local = store.get(KEY);
  if (local) { try { shows = JSON.parse(local); mode='local';
    return; } catch {} }
  try { const r = await fetch('shows.json', {cache:'no-store'}); if (r.ok) { const d = await r.json(); if (Array.isArray(d)) { shows = d; return; } } } catch {}
  shows = JSON.parse($('#seed').textContent); mode='local';
}

// Send one change to the database. Returns the response JSON, or null if it wasn't saved.
async function api(method, url, body){
  if (!user) { setState('Not saved: sign in to edit'); openLogin('Sign in to save your changes.'); return null; }
  setState('Saving…');
  try {
    const init = {method, credentials:'same-origin', headers:{'content-type':'application/json'}};
    if (body !== undefined) init.body = JSON.stringify(body);
    const r = await fetch(url, init);
    if (r.status === 401) { setState('Not saved: session expired'); openLogin('Your session expired. Sign in again to save.'); return null; }
    if (r.status === 403) { setState('Not saved: this account can’t edit'); toast('This account doesn’t have edit access.'); return null; }
    if (r.status === 400 || r.status === 409) { setState('Not saved'); toast(await r.text()); return null; }
    if (!r.ok) throw new Error(r.status);
    setState('Saved');
    return await r.json();
  } catch(e){ setState('Save failed. Check your connection and try again.'); return null; }
}
// op = {method, url, body} for the database; local mode saves the whole list in this browser.
// If the database refuses a change, reload so the page shows what's really saved.
async function persist(op){
  if (mode !== 'netlify') { store.set(KEY, JSON.stringify(shows)); setState('Saved in this browser'); return; }
  if (await api(op.method, op.url, op.body) === null) { await loadRaw(); shows = shows.map(withPlace); render(); }
}
/* ---------- Netlify Identity ---------- */
let idn = null, user = null;
const canEdit = () => mode !== 'netlify' || !!user;
function applyAuth(){
  document.body.classList.toggle('readonly', !canEdit());
  const b = $('#btnAuth'); if (!b) return;
  b.hidden = mode !== 'netlify';
  $('#btnHistory').hidden = mode !== 'netlify' || !user;
  b.textContent = user ? 'Sign out' : 'Sign in';
  b.title = user ? `Signed in as ${user.email||user.name||''}` : '';
  if (mode==='netlify') setState(user ? (user.name||user.email||'Signed in') : 'View only');
}
async function initIdentity(){
  try { idn = await import('./vendor/identity.js'); } catch { return; }
  try {
    const res = await idn.handleAuthCallback();
    if (res?.type === 'invite') openSetPassword('invite', res.token);
    else if (res?.type === 'recovery') openSetPassword('recovery');
    else if (res?.type === 'oauth' || res?.type === 'confirmation') toast('Signed in');
  } catch(e){ toast('That sign-in link didn’t work. It may have expired.'); }
  user = await idn.getUser();
  idn.onAuthChange((ev, u) => { user = u; applyAuth(); });
}
async function openLogin(msg){
  if (!idn) return;
  let providers = {}; try { providers = (await idn.getSettings()).providers || {}; } catch {}
  const names = {google:'Google', github:'GitHub', gitlab:'GitLab', bitbucket:'Bitbucket'};
  const oauth = Object.keys(names).filter(p => providers[p]);
  openSheet(`<h3>Sign in</h3><form id="frm">
    ${msg?`<p class="hint" style="font-size:14px">${esc(msg)}</p>`:''}
    ${oauth.map(p=>`<button type="button" data-oauth="${p}">Continue with ${names[p]}</button>`).join('')}
    ${providers.email!==false?`${oauth.length?'<p class="hint" style="text-align:center">or</p>':''}
    <label for="f-email">Email<input id="f-email" type="email" autocomplete="email" required></label>
    <label for="f-pass">Password<input id="f-pass" type="password" autocomplete="current-password" required></label>
    <div class="foot"><button class="primary" type="submit">Sign in</button><button type="button" data-close>Cancel</button><span class="spacer"></span><button type="button" id="forgot">Forgot password</button></div>`:''}
    <div id="authErr" class="hint" role="alert"></div></form>`);
  document.querySelectorAll('[data-oauth]').forEach(b => b.onclick = () => idn.oauthLogin(b.dataset.oauth));
  $('#frm').addEventListener('submit', async e => { e.preventDefault();
    try { user = await idn.login($('#f-email').value, $('#f-pass').value); closeSheet(); applyAuth(); toast('Signed in'); }
    catch(err){ $('#authErr').textContent = err?.status===401 ? 'Wrong email or password.' : (err?.message || 'Sign-in failed. Try again.'); } });
  $('#forgot') && ($('#forgot').onclick = async () => { const em=$('#f-email').value; if(!em){ $('#authErr').textContent='Enter your email first.'; return; }
    try { await idn.requestPasswordRecovery(em); $('#authErr').textContent='Check your email for a reset link.'; } catch { $('#authErr').textContent='Couldn’t send the reset email.'; } });
}
function openSetPassword(kind, token){
  openSheet(`<h3>${kind==='invite'?'Accept invite':'New password'}</h3><form id="frm">
    <label for="f-pass">Choose a password<input id="f-pass" type="password" autocomplete="new-password" minlength="8" required></label>
    <div class="foot"><button class="primary" type="submit">Save password</button></div><div id="authErr" class="hint" role="alert"></div></form>`);
  $('#frm').addEventListener('submit', async e => { e.preventDefault();
    try { user = kind==='invite' ? await idn.acceptInvite(token, $('#f-pass').value) : await idn.updateUser({password:$('#f-pass').value});
      closeSheet(); applyAuth(); toast('Password saved. You’re signed in.'); }
    catch(err){ $('#authErr').textContent = err?.message || 'Couldn’t save the password.'; } });
}
function setState(s){ $('#saveState').textContent = s; }

/* ---------- grouping & render ---------- */
function nights(list){
  const map = new Map();
  list.forEach((s,i) => {
    const k = (s.date||'undated') + '|' + s.venue.toLowerCase() + '|' + s.city.toLowerCase();
    if (!map.has(k)) map.set(k, {date:s.date, venue:s.venue, city:s.city, state:s.state, country:s.country, acts:[], idx:i});
    map.get(k).acts.push(s);
  });
  return [...map.values()].sort((a,b) => {
    if (!a.date && !b.date) return a.idx-b.idx;
    if (!a.date) return 1; if (!b.date) return -1;
    return b.date.localeCompare(a.date) || a.idx-b.idx;
  });
}
function matches(s){
  if (filt.type && s.type !== filt.type) return false;
  if (filt.city && cityKey(s) !== filt.city) return false;
  if (filt.q){ const q=filt.q.toLowerCase(); return [s.artist,s.venue,place(s),s.notes].some(v=>(v||'').toLowerCase().includes(q)); }
  return true;
}

// Header totals count from what was last shown (0 on load) to the new value
const statShown = {};
function countTo(el, label, to){
  const from = statShown[label] ?? 0;
  statShown[label] = to;
  if (from === to || !motionOK()) { el.textContent = to; return; }
  const ms = 700, t0 = performance.now();
  const step = now => {
    if (!el.isConnected) return;
    const p = Math.min((now - t0) / ms, 1);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function renderStats(){
  const past = shows.filter(happened);
  const n = nights(past);
  const artists = new Map(); past.forEach(s => { const k=s.artist.trim(); artists.set(k,(artists.get(k)||0)+1); });
  const venues = new Set(past.map(s=>s.venue.toLowerCase()).filter(Boolean));
  const cities = new Set(past.filter(s=>s.city).map(cityKey));
  const totals = [[n.length,'Nights out'],[artists.size,'Artists'],[venues.size,'Venues'],[cities.size,'Cities']];
  $('#stats').innerHTML = totals.map(([v,l])=>`<div class="stat"><b>${statShown[l] ?? 0}</b><span>${l}</span></div>`).join('');
  $('#stats').querySelectorAll('b').forEach((b, i) => countTo(b, totals[i][1], totals[i][0]));
  const reps = [...artists].filter(([,c])=>c>1).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  const top = showAllMost ? reps : reps.slice(0,8);
  $('#most').innerHTML = reps.length ? `<span class="lbl">Seen 2+ times</span>` + top.map(([a,c])=>`<button class="chip" data-q="${esc(a)}" type="button">${esc(a)}<em>×${c}</em></button>`).join('')
    + (reps.length>8 ? `<button type="button" class="more" id="moreBtn">${showAllMost?'Show fewer':`All ${reps.length} →`}</button>` : '') : '';
  const sel = $('#city'), cur = sel.value;
  const allCities = [...new Set(shows.filter(s=>s.city).map(cityKey))].sort();
  sel.innerHTML = '<option value="">All cities</option>' + allCities.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('');
}

function stub(n){
  const up = !happened(n), isToday = n.date === TODAY;
  const [Y,M,D] = n.date ? n.date.split('-') : [];
  const types = [...new Set(n.acts.map(a=>a.type))];
  const notes = n.acts.map(a=>a.notes).filter(Boolean);
  const k = nightKey(n);
  let seen = 'reveal';
  if (revealed.has(k)) seen = 'in';
  let billBtn = '';
  if (n.acts.length > 1) billBtn = `<button class="add-act" type="button" data-bill="${n.acts[0].id}">Edit bill</button>`;
  return `<article class="stub ${up?'is-up':''} ${seen}" data-k="${esc(k)}">
      <div class="date">${n.date ? `<span class="m">${MONTHS[+M-1]}</span><span class="d">${+D}</span><span class="y">${Y}</span>` : `<span class="m">Date</span><span class="d">?</span>`}</div>
      <div class="body">
        <div class="where"><strong>${n.venue?`<button type="button" class="vbtn" data-venue="${esc(n.venue+'|'+n.city)}">${esc(n.venue)}</button>`:'Unknown venue'}</strong><span>${esc(place(n))}</span>
          ${types.map(t=>`<span class="tag ${t.toLowerCase()}">${esc(t)}</span>`).join('')}
          ${isToday?'<span class="tag up">Tonight</span>':up?'<span class="tag up">Upcoming</span>':''}</div>
        <ul class="acts">${n.acts.map((a,i)=>`<li class="${i===0?'first':''}"><button type="button" data-artist="${esc(a.artist)}" data-id="${a.id}" title="About ${esc(a.artist)}">${esc(a.artist)}</button></li>`).join('')}</ul>
        ${notes.length?`<div class="notes">${notes.map(esc).join(' · ')}</div>`:''}
        <div class="tools edit-only"><button class="add-act" type="button" data-addto="${n.acts[0].id}">+ act on this bill</button>${billBtn}</div>
      </div></article>`;
}
// Stubs fade up the first time they scroll into view; ones already seen render in place,
// so re-rendering after an edit only animates nights that are new or changed.
const nightKey = n => [n.date||'undated', n.venue, n.city, n.acts.map(a=>a.id).join(',')].join('|').toLowerCase();
const revealed = new Set();
let revealer = null;
if ('IntersectionObserver' in window) revealer = new IntersectionObserver(entries => entries.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.replace('reveal', 'in'); revealed.add(e.target.dataset.k); revealer.unobserve(e.target);
}), {rootMargin:'0px 0px -24px 0px'});
function watchReveals(){
  revealer?.disconnect();
  document.querySelectorAll('.stub.reveal').forEach(el => {
    if (revealer && motionOK()) revealer.observe(el);
    else { el.classList.replace('reveal', 'in'); revealed.add(el.dataset.k); }
  });
}
// Filtering swaps the list in place: a quick cross-fade instead of every stub fading up
function filterList(){ replay($('#list'), 'swap'); renderList(); }

function renderList(){
  const all = nights(shows.filter(matches));
  if (!all.length){ $('#list').innerHTML = `<div class="empty">No shows match. Clear the search or add one with “+ Add show”.</div>`; return; }
  // upcoming nights are pinned on top, soonest first; the year groups only hold shows that have happened
  const next = all.filter(n=>!happened(n)).sort((a,b)=>a.date.localeCompare(b.date) || a.idx-b.idx);
  const list = all.filter(happened);
  let html='', yr=null;
  if (next.length) html += `<div class="year next"><h2>Up next</h2><span>${next.length} show${next.length>1?'s':''}</span></div>` + next.map(stub).join('');
  const counts = {}; list.forEach(n => { const y=n.date?n.date.slice(0,4):'Undated'; counts[y]=(counts[y]||0)+1; });
  for (const n of list){
    const y = n.date ? n.date.slice(0,4) : 'Undated';
    if (y !== yr){ yr=y; html += `<div class="year"><h2>${y}</h2><span>${counts[y]} night${counts[y]>1?'s':''}</span></div>`; }
    html += stub(n);
  }
  $('#list').innerHTML = html;
  watchReveals();
}

/* ---------- stats view ---------- */
const fmt = d => { const [y,m,dd]=d.split('-'); return `${MONTHS[+m-1]} ${+dd}, ${y}`; };
const yrs = (a,b) => ((new Date(b) - new Date(a)) / 31557600000);
function renderStatsView(){
  const past = shows.filter(happened);
  const dated = past.filter(s => s.date);
  const ns = nights(past), nd = ns.filter(n=>n.date);
  const nightType = n => n.acts.some(a=>a.type==='Music') ? 'Music' : 'Comedy';

  // per artist sightings (by night)
  const art = new Map();
  dated.forEach(s => { const k=s.artist.trim().toLowerCase(); if(!art.has(k)) art.set(k,{name:s.artist.trim(),dates:[]}); art.get(k).dates.push(s.date); });
  past.filter(s=>!s.date).forEach(s => { const k=s.artist.trim().toLowerCase(); if(!art.has(k)) art.set(k,{name:s.artist.trim(),dates:[]}); (art.get(k).undated=(art.get(k).undated||0)+1); });
  const A = [...art.values()].map(a => { a.dates = [...new Set(a.dates)].sort(); a.times = a.dates.length + (a.undated||0);
    let gap=0, gf=null, gt=null; for(let i=1;i<a.dates.length;i++){ const g=yrs(a.dates[i-1],a.dates[i]); if(g>gap){gap=g;gf=a.dates[i-1];gt=a.dates[i];} }
    return {...a, gap, gf, gt, span: a.dates.length>1 ? yrs(a.dates[0], a.dates.at(-1)) : 0}; });

  // highlights
  const biggest = [...nd].sort((a,b)=>b.acts.length-a.acts.length)[0];
  const longGap = [...A].sort((a,b)=>b.gap-a.gap)[0];
  const longSpan = [...A].filter(a=>a.dates.length>2).sort((a,b)=>b.span-a.span)[0] || [...A].sort((a,b)=>b.span-a.span)[0];
  const byYear = {}; nd.forEach(n=>{ const y=+n.date.slice(0,4); byYear[y]=byYear[y]||{Music:0,Comedy:0}; byYear[y][nightType(n)]++; });
  const yearsList = Object.keys(byYear).map(Number);
  const y0 = Math.min(...yearsList), y1 = Math.max(...yearsList);
  const busiest = yearsList.sort((a,b)=>(byYear[b].Music+byYear[b].Comedy)-(byYear[a].Music+byYear[a].Comedy))[0];
  let streak=0, run=0, sEnd=0; for(let y=y0;y<=y1;y++){ if(byYear[y]){run++; if(run>streak){streak=run;sEnd=y;}} else run=0; }
  const first = nd.at(-1), sameDay = new Set(), solo = nd.filter(n=>n.acts.length===1).length;
  const comedyN = ns.filter(n=>nightType(n)==='Comedy').length;
  const repeatVenue = new Map(); ns.forEach(n=>{ const k=n.venue.toLowerCase(); if(k) repeatVenue.set(k,(repeatVenue.get(k)||0)+1); });
  const sets = past.length;

  const hl = [
    [`${sets}`, 'Sets seen', `${(sets/ns.length).toFixed(1)} acts per night on average. ${solo} nights were a single act.`],
    [`${biggest.acts.length} acts`, 'Biggest bill', `${esc(biggest.venue)}, ${fmt(biggest.date)}`],
    [`${longGap.gap.toFixed(1)} yrs`, 'Longest wait to see again', `${esc(longGap.name)}: ${fmt(longGap.gf)} → ${fmt(longGap.gt)}`],
    [`${longSpan.span.toFixed(0)} yrs`, 'Longest-running (3+ times)', `${esc(longSpan.name)}, ${longSpan.dates[0].slice(0,4)}–${longSpan.dates.at(-1).slice(0,4)}`],
    [`${busiest}`, 'Busiest year', `${byYear[busiest].Music+byYear[busiest].Comedy} nights out`],
    [`${streak} yrs`, 'Longest yearly streak', `${sEnd-streak+1}–${sEnd}, at least one show every year`],
    [`${Math.round(comedyN/ns.length*100)}%`, 'Comedy nights', `${comedyN} of ${ns.length} nights were stand-up`],
    [fmt(first.date).split(', ')[1], 'First logged show', `${esc(first.acts.map(a=>a.artist).join(' + '))}, ${esc(place(first))}`],
  ];

  // year bars incl. empty years
  const maxY = Math.max(...Object.values(byYear).map(v=>v.Music+v.Comedy));
  let yb=''; for(let y=y0;y<=y1;y++){ const v=byYear[y]||{Music:0,Comedy:0}, t=v.Music+v.Comedy;
    yb += `<div class="col ${t?'':'zero'}" title="${y}: ${v.Music} music, ${v.Comedy} comedy"><span class="n">${t||''}</span><div class="stack">
      ${v.Comedy?`<div class="seg-c" style="height:${v.Comedy/maxY*100}%"></div>`:''}${v.Music?`<div class="seg-m" style="height:${v.Music/maxY*100}%"></div>`:''}</div>
      <span class="x">'${String(y).slice(2)}</span></div>`; }
  // months
  const byM = Array(12).fill(0); nd.forEach(n=>byM[+n.date.slice(5,7)-1]++); const maxM=Math.max(...byM);
  const mb = byM.map((c,i)=>`<div class="col" title="${MONTHS[i]}: ${c} nights"><span class="n">${c||''}</span><div class="stack"><div class="seg-m" style="height:${c/maxM*100}%"></div></div><span class="x">${MONTHS[i]}</span></div>`).join('');
  // rankings
  const rank = (m, n=10, attr) => { const arr=[...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,n); const mx=arr[0]?.[1]||1;
    return `<ol class="rank">${arr.map(([k,c])=>`<li><span class="lab" style="--w:${c/mx*100}%">${attr?`<button type="button" ${attr(k)}>${esc(k)}</button>`:esc(k)}</span><span class="c">${c}</span></li>`).join('')}</ol>`; };
  const multiCity = new Set(); { const seen = {}; ns.forEach(n => { if(!n.venue) return; (seen[n.venue] ??= new Set()).add(n.city); if (seen[n.venue].size>1) multiCity.add(n.venue); }); }
  const venueLabel = n => multiCity.has(n.venue) ? `${n.venue} (${n.city})` : n.venue, venueKeyOf = {};
  const venueNames = new Map(); ns.forEach(n=>{ if(n.venue){ const l=venueLabel(n); venueKeyOf[l]=n.venue+'|'+n.city; venueNames.set(l,(venueNames.get(l)||0)+1);} });
  const cityN = new Map(); ns.forEach(n=>{ if(n.city){ const k=place(n); cityN.set(k,(cityN.get(k)||0)+1);} });
  // repeat table
  const reps = A.filter(a=>a.times>1).sort((a,b)=>b.times-a.times||b.span-a.span||a.name.localeCompare(b.name));
  const tbl = `<table class="rep"><thead><tr><th>Artist</th><th class="num">Times</th><th>First</th><th>Latest</th><th class="num">Span</th></tr></thead><tbody>
    ${reps.map(a=>`<tr><td><button type="button" data-artist="${esc(a.name)}">${esc(a.name)}</button></td><td class="num">${a.times}</td>
      <td>${a.dates[0]?fmt(a.dates[0]):'—'}</td><td>${a.dates.length?fmt(a.dates.at(-1)):'—'}</td><td class="num">${a.span?a.span.toFixed(0)+' yr':'—'}</td></tr>`).join('')}</tbody></table>`;

  $('#statsView').innerHTML = `
    <div class="panel"><h3>Highlights</h3><div class="hl">${hl.map(([b,l,p])=>`<div><span>${l}</span><b>${b}</b><p>${p}</p></div>`).join('')}</div></div>
    ${eraPanel(ns)}
    <div class="panel"><h3>Nights per year <span class="legend"><span><i style="background:var(--music)"></i>Music</span><span><i style="background:var(--comedy)"></i>Comedy</span></span></h3><div class="bars">${yb}</div></div>
    <div class="two">
      <div class="panel"><h3>Top venues <span>nights</span></h3>${rank(venueNames, 10, k => `data-venue="${esc(venueKeyOf[k])}"`)}</div>
      <div class="panel"><h3>Cities <span>nights</span></h3>${rank(cityN)}</div>
    </div>
    <div class="panel"><h3>By month</h3><div class="bars" style="height:120px">${mb}</div></div>
    <div class="panel"><h3>Seen more than once <span>${reps.length} artists</span></h3><div class="tbl-wrap">${tbl}</div></div>`;
}

/* ---------- before / after the move ---------- */
const METRO = {Tempe:'Phoenix',Scottsdale:'Phoenix',Mesa:'Phoenix',Chandler:'Phoenix',Glendale:'Phoenix',Gilbert:'Phoenix'};
const metro = n => n.state==='AZ' && METRO[n.city] ? 'Phoenix, AZ' : place(n);
function eraPanel(ns){
  const move = store.get('show-log-move') || '2021-06-01';
  const nd = ns.filter(n=>n.date);
  const side = list => {
    if (!list.length) return null;
    const d0 = list.at(-1).date, d1 = list[0].date;
    const end = list === afterL ? TODAY : move;
    const spanY = Math.max(yrs(list === afterL ? move : d0, end), 0.5);
    const acts = list.reduce((t,n)=>t+n.acts.length,0);
    const comedy = list.filter(n=>!n.acts.some(a=>a.type==='Music')).length;
    const cityC = new Map(); list.forEach(n=>{ const c=metro(n); cityC.set(c,(cityC.get(c)||0)+1); });
    const home = [...cityC].sort((a,b)=>b[1]-a[1])[0];
    const venC = new Map(); list.forEach(n=>venC.set(n.venue,(venC.get(n.venue)||0)+1));
    const topVen = [...venC].sort((a,b)=>b[1]-a[1])[0];
    const artC = new Map(); list.forEach(n=>n.acts.forEach(a=>{ const k=a.artist.trim(); artC.set(k,(artC.get(k)||0)+1); }));
    const topArt = [...artC].filter(([,c])=>c>1).sort((a,b)=>b[1]-a[1]).slice(0,4);
    const fest = list.filter(n=>n.acts.length>=3).length;
    return { n:list.length, d0, d1, rate:list.length/spanY, perNight:acts/list.length, comedyPct:comedy/list.length*100,
      home, away:list.length-home[1], cities:cityC.size, topVen, topArt, fest, artists:new Set(artC.keys()) };
  };
  const beforeL = nd.filter(n=>n.date < move), afterL = nd.filter(n=>n.date >= move);
  const B = side(beforeL), Af = side(afterL);
  const cmp = (a,b,fmtv,higherIs='') => { if(!a||!b) return ''; const diff=b-a; if(Math.abs(diff)<0.05) return ''; return ` <span class="${diff>0?'up':'dn'}">${diff>0?'▲':'▼'} ${fmtv(Math.abs(diff))}</span>`; };
  const col = (title, X, other, isAfter) => !X ? `<div><h4>${title}</h4><p class="rng">No dated shows yet.</p></div>` : `<div>
    <div><h4>${title}</h4><span class="rng">${fmt(X.d0)} – ${fmt(X.d1)}</span></div>
    <dl>
      <dt>Nights</dt><dd><b>${X.n}</b></dd>
      <dt>Per year</dt><dd><b>${X.rate.toFixed(1)}</b>${isAfter?cmp(other?.rate,X.rate,v=>v.toFixed(1)):''}</dd>
      <dt>Acts / night</dt><dd>${X.perNight.toFixed(1)}${isAfter?cmp(other?.perNight,X.perNight,v=>v.toFixed(1)):''}</dd>
      <dt>Comedy</dt><dd>${Math.round(X.comedyPct)}%${isAfter?cmp(other?.comedyPct,X.comedyPct,v=>Math.round(v)+' pts'):''}</dd>
      <dt>Home scene</dt><dd>${esc(X.home[0])} · ${Math.round(X.home[1]/X.n*100)}% of nights</dd>
      <dt>Road trips</dt><dd>${X.away} night${X.away===1?'':'s'} in ${X.cities-1} other cit${X.cities-1===1?'y':'ies'}</dd>
      <dt>Festivals / 3+ acts</dt><dd>${X.fest}</dd>
      <dt>Go-to venue</dt><dd>${esc(X.topVen[0])} (${X.topVen[1]})</dd>
      <dt>Most seen</dt><dd>${X.topArt.length ? X.topArt.map(([a,c])=>`${esc(a)} ×${c}`).join(', ') : 'No repeats'}</dd>
    </dl></div>`;
  const both = B && Af ? [...Af.artists].filter(a=>B.artists.has(a)).sort() : [];
  return `<div class="panel"><h3>Before & after the move
      <label class="movectl" for="f-move">Moved <input type="date" id="f-move" value="${move}"></label></h3>
    <div class="era">${col('Before', B, null, false)}${col('After', Af, B, true)}</div>
    ${both.length?`<div class="both"><span class="lbl">Followed you west</span>${both.map(a=>`<button class="chip" type="button" data-q="${esc(a)}">${esc(a)}</button>`).join('')}</div>`:''}
  </div>`;
}

function openAdd(base){

// Reorder one night's acts: first = headliner
function openBill(id){
  const night = nights(shows).find(n => n.acts.some(a => a.id === id)); if (!night) return;
  let order = night.acts.map(a => a.id), moved = null;
  const name = x => shows.find(s => s.id === x).artist;
  const draw = () => {
    $('#billList').innerHTML = order.map((x, i) => {
      let ctl = '<span class="star">★ Headliner</span>';
      if (i > 0) {
        let down = '';
        if (i < order.length - 1) down = `<button type="button" data-move="${i}" data-by="1" aria-label="Move ${esc(name(x))} down">↓</button>`;
        ctl = `<button type="button" data-move="${i}" data-by="-1" aria-label="Move ${esc(name(x))} up">↑</button>${down}<button type="button" data-top="${i}">Make headliner</button>`;
      }
      let cls = '';
      if (x === moved) cls = 'moved';
      return `<li class="${cls}"><span class="name">${esc(name(x))}</span><span class="ctl">${ctl}</span></li>`;
    }).join('');
  };
  let when = 'Undated';
  if (night.date) when = fmt(night.date);
  openSheet(`<h3>Edit bill</h3><form id="frm">
    <p class="hint bill-for">${esc(night.venue || 'Unknown venue')} · ${esc(when)}</p>
    <ol class="bill" id="billList"></ol>
    <div class="foot"><button type="button" id="billReverse">Reverse order</button></div>
    <div class="foot"><button class="primary" type="submit">Save</button><button type="button" data-close>Cancel</button></div></form>`);
  draw();
  $('#billList').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const i = +(b.dataset.move ?? b.dataset.top);
    moved = order[i];
    if (b.dataset.top !== undefined) order = [order[i], ...order.filter((_, j) => j !== i)];
    else { const j = i + +b.dataset.by; [order[i], order[j]] = [order[j], order[i]]; }
    draw();
  });
  $('#billReverse').onclick = () => { order.reverse(); moved = order[0]; draw(); };
  $('#frm').addEventListener('submit', e => { e.preventDefault();
    if (order.join() === night.acts.map(a => a.id).join()) { closeSheet(); return; }
    // the night keeps its place in the list: its acts go back where the first one was, in the new order
    const at = shows.findIndex(s => order.includes(s.id));
    const acts = order.map(x => shows.find(s => s.id === x));
    shows = shows.filter(s => !order.includes(s.id));
    shows.splice(at, 0, ...acts);
    commit(`${acts[0].artist} is the headliner`, {method:'POST', url:`${API}/order`, body:{ids:order}});
  });
}

  if ($('#reset')) $('#reset').onclick = () => {
    $('#confirmBox').innerHTML = `<div class="confirm">Replace everything with the original imported list? <button type="button" class="danger" id="rYes">Reset</button><button type="button" id="rNo">Cancel</button></div>`;
    $('#rYes').onclick = () => { shows = JSON.parse($('#seed').textContent).map(withPlace); commit('Reset to original list', {method:'PUT', url:API, body:shows}); };
    $('#rNo').onclick = () => $('#confirmBox').innerHTML='';
  };
}

const SHOW_LABELS = {artist:'Artist', venue:'Venue', city:'City', state:'State', country:'Country', date:'Date', type:'Type', notes:'Notes'};
const INFO_LABELS = {wiki:'Wikipedia page', desc:'Description', img:'Photo', note:'Note'};
const fmtVal = v => { if (v === null || v === undefined || v === '') return '—'; if (Array.isArray(v)) return v.join(', '); return String(v); };
function changeTitle(c){
  const r = c.after || c.before;
  if (c.table === 'shows') return `${r.artist} · ${r.venue || place(r) || 'No venue'} · ${r.date || 'Undated'}`;
  if (c.table === 'venues') return `Venue info: ${c.row.replace('|', ', ')}`;
  return `Artist info: ${c.row}`;
}
function changeVerb(c){
  if (c.undo_of) return `Undid change #${c.undo_of}`;
  if (c.action === 'insert') return 'Added';
  if (c.action === 'delete') return 'Deleted';
  return 'Edited';
}
// What changed, field by field, for an update
function changeDiff(c){
  if (c.action !== 'update') return [];
  if (c.table === 'shows') {
    const out = Object.keys(SHOW_LABELS).filter(k => fmtVal(c.before[k]) !== fmtVal(c.after[k]))
      .map(k => [SHOW_LABELS[k], fmtVal(c.before[k]), fmtVal(c.after[k])]);
    if (!out.length && c.after.sort_order < c.before.sort_order) out.push(['Billing order', 'moved up', '']);
    if (!out.length && c.after.sort_order > c.before.sort_order) out.push(['Billing order', 'moved down', '']);
    return out;
  }
  const b = c.before.info, a = c.after.info;
  if (!b && a) return [['Matched to', '—', a.wiki || a.desc || 'info']];
  if (b && !a) return [['Match removed', b.wiki || '', '']];
  return Object.keys(INFO_LABELS).filter(k => fmtVal(b?.[k]) !== fmtVal(a?.[k])).map(k => [INFO_LABELS[k], fmtVal(b?.[k]), fmtVal(a?.[k])]);
}
function changeItem(c){
  const when = new Date(c.at).toLocaleString(undefined, {dateStyle:'medium', timeStyle:'short'});
  const diff = changeDiff(c).map(([f, from, to]) => {
    let val = esc(from);
    if (to) val = `<del>${esc(from)}</del> <span class="arrow">→</span> <ins>${esc(to)}</ins>`;
    return `<li><span class="f">${esc(f)}</span><span>${val}</span></li>`;
  }).join('');
  let action = `<button type="button" data-undo="${c.id}">Undo</button>`;
  if (c.undone) action = '<span class="tag">Undone</span>';
  let diffList = '';
  if (diff) diffList = `<ul class="diff">${diff}</ul>`;
  return `<li class="change ${c.action}">
    <div class="head"><span class="verb">${esc(changeVerb(c))}</span><span class="what">${esc(changeTitle(c))}</span>${action}</div>
    ${diffList}
    <div class="meta">#${c.id} · ${esc(when)} · ${esc(c.by || 'unknown')}</div></li>`;
}
let historyFor = null;
async function openHistory(table, key, before){
  historyFor = {table, key};
  let title = 'All recent changes';
  if (table === 'shows') title = changeTitle({table, after: shows.find(s => s.id === key) || {artist:key}});
  else if (table) title = changeTitle({table, row: key, after: {}});
  if (!before) openSheet(`<h3>History</h3><p class="hint history-for">${esc(title)}</p><ol class="history" id="historyList"><li class="hint">Loading…</li></ol><div class="foot" id="historyMore"></div><div class="foot"><button type="button" data-close>Close</button></div>`);
  const q = new URLSearchParams();
  if (table) q.set('table', table);
  if (key) q.set('row', key);
  if (before) q.set('before', before);
  const res = await api('GET', '/api/changes?' + q);
  if (!res) { closeSheet(); return; }
  const list = $('#historyList'); if (!list) return;
  if (!before) list.innerHTML = '';
  list.insertAdjacentHTML('beforeend', res.changes.map(changeItem).join(''));
  if (!list.children.length) list.innerHTML = '<li class="hint">No changes yet.</li>';
  const last = res.changes[res.changes.length - 1];
  $('#historyMore').innerHTML = '';
  if (res.more) $('#historyMore').innerHTML = `<button type="button" data-history-more="${last.id}">Older changes</button>`;
  setState(user.name || user.email || 'Signed in');
}
async function undoChange(id){
  if (await api('POST', `/api/changes/${id}/undo`) === null) return;
  toast('Change undone');
  await loadRaw(); shows = shows.map(withPlace); await loadInfo(); render();
  openHistory(historyFor.table, historyFor.key);
}

/* ---------- artist & venue info ---------- */
let INFO = {artists:{}, venues:{}};
const infoKey = (kind, name) => kind==='artists' ? name : name;
async function loadInfo(){
  try { if (mode==='netlify'){ const r = await fetch('/api/info',{cache:'no-store'}); if (r.ok){ INFO = await r.json(); return; } } } catch {}
  try { INFO = (JSON.parse(store.get('show-log-info-v2') || 'null') || JSON.parse($('#info-seed').textContent)); } catch { INFO = JSON.parse($('#info-seed').textContent); }
}
async function saveInfo(kind, key){
  if (mode !== 'netlify'){ store.set('show-log-info-v2', JSON.stringify(INFO)); return true; }
  return await api('PUT', '/api/info', {kind, key, info: INFO[kind][key]}) !== null;
}
const imgUrl = (img, w=800) => { if(!img) return ''; const [f,wiki] = img.split('|'); return `https://${wiki==='en'?'en.wikipedia.org':'commons.wikimedia.org'}/wiki/Special:FilePath/${encodeURIComponent(f)}?width=${w}`; };
const fileUrl = img => { const [f,wiki] = img.split('|'); return `https://${wiki==='en'?'en.wikipedia.org':'commons.wikimedia.org'}/wiki/File:${encodeURIComponent(f)}`; };
const wikiUrl = t => `https://en.wikipedia.org/wiki/${encodeURIComponent(t.replace(/ /g,'_'))}`;
const yr = d => d ? String(d).slice(0,4) : '';
const fmtFull = d => { if(!d) return ''; const p=String(d).split('-'); return p.length===3 ? fmt(d) : p.length===2 ? `${MONTHS[+p[1]-1]} ${p[0]}` : p[0]; };
let infoReq = 0;
function openInfo(kind, key, actId){
  const rec = INFO[kind]?.[key] || null;
  const isA = kind==='artists';
  const [vName, vCity] = isA ? [key,''] : key.split('|');
  const title = isA ? key : vName;
  const facts = [];
  if (rec){
    const F = (l,v) => v && facts.push([l,v]);
    if (isA){
      F('Formed', [yr(rec.inception), rec.dissolved?`– ${yr(rec.dissolved)}`:''].join(' ').trim());
      F('From', [rec.formed_in, rec.country].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(', '));
      F('Born', rec.born ? `${fmtFull(rec.born)}${rec.birthplace?`, ${rec.birthplace}`:''}` : '');
      if (!rec.born && !rec.formed_in) F('From', rec.birthplace || rec.citizenship);
      F('Genres', (rec.genre||[]).join(', '));
    } else {
      F('Opened', fmtFull(rec.opened));
      F('Capacity', rec.capacity ? Number(rec.capacity).toLocaleString() : '');
      F('Also known as', (rec.aka||[]).join(', '));
    }
    F('Website', rec.website ? `<a href="https://${esc(rec.website)}" target="_blank" rel="noopener">${esc(rec.website)}</a>` : '');
  }
  // your history with them
  const mine = shows.filter(s => isA ? s.artist===key : (s.venue===vName && s.city===vCity))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const rows = (list, soonestFirst) => isA
    ? list.map(s=>`<li><span>${s.date?fmt(s.date):'No date'}</span><span>${esc(s.venue)}, ${esc(place(s))}</span></li>`)
    : (soonestFirst ? nights(list).reverse() : nights(list)).map(n=>`<li><span>${n.date?fmt(n.date):'No date'}</span><span>${n.acts.map(a=>esc(a.artist)).join(' / ')}</span></li>`);
  const seen = mine.filter(happened), coming = mine.filter(s=>!happened(s)).reverse();
  const seenN = isA ? seen.length : nights(seen).length, comingN = isA ? coming.length : nights(coming).length;
  const initials = title.replace(/^the\s+/i,'').split(/\s+/).map(w=>w[0]).join('').slice(0,2);
  const box = $('#info');
  box.innerHTML = `
    <div class="hero">${rec?.img?`<img src="${imgUrl(rec.img)}" alt="${esc(title)}" onload="this.parentNode.classList.add('loaded')" onerror="this.remove()">`:''}<div class="ph" aria-hidden="true">${esc(initials)}</div>
      ${rec?.img?`<div class="credit"><a href="${fileUrl(rec.img)}" target="_blank" rel="noopener" id="credit">Photo: Wikimedia Commons</a></div>`:''}
      <button type="button" class="x" data-close-info aria-label="Close">×</button></div>
    <div class="ib">
      <div><h2>${esc(title)}</h2><div class="desc">${rec ? esc(rec.desc||'') : (isA?'No Wikipedia match yet.':`${esc(vCity)} · No Wikipedia match yet.`)}</div></div>
      ${rec?.note?`<div class="note">${esc(rec.note)}</div>`:''}
      ${facts.length?`<dl class="facts">${facts.map(([l,v])=>`<div><dt>${l}</dt><dd>${l==='Website'?v:esc(v)}</dd></div>`).join('')}</dl>`:''}
      ${rec?.wiki?`<div class="sum loading" id="sum">Loading the Wikipedia summary…</div>`:''}
      ${comingN?`<div class="seen next"><h4>Coming up · ${comingN}</h4><ul>${rows(coming, true).join('')}</ul></div>`:''}
      ${seenN||!comingN?`<div class="seen"><h4>${isA?`You've seen them ${seenN} time${seenN===1?'':'s'}`:`${seenN} night${seenN===1?'':'s'} here`}</h4><ul>${rows(seen).join('')}</ul></div>`:''}
      <div class="links">${rec?.wiki?`<a href="${wikiUrl(rec.wiki)}" target="_blank" rel="noopener">Read on Wikipedia ↗</a>`:''}
        <span class="spacer"></span>
        <button type="button" class="edit-only" data-info-edit="${esc(kind)}" data-key="${esc(key)}">Edit info</button>
        ${actId?`<button type="button" class="edit-only" data-edit="${actId}">Edit this show</button>`:''}
        <button type="button" data-q="${esc(title)}">Show in log</button></div>
    </div>`;
  show(box); show($('#scrim')); box.querySelector('.x').focus();
  if (rec?.wiki) loadSummary(rec, ++infoReq);
}
async function loadSummary(rec, req){
  const el = () => req===infoReq ? $('#sum') : null;
  try {
    const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(rec.wiki.replace(/ /g,'_'))}`);
    const j = await r.json(); const e = el(); if (!e) return;
    e.classList.remove('loading'); e.textContent = j.extract || ''; if (!j.extract) e.remove();
  } catch { const e = el(); if (e) e.remove(); }
  if (rec.img) try {
    const [f,wiki] = rec.img.split('|');
    const u = `https://${wiki==='en'?'en.wikipedia.org':'commons.wikimedia.org'}/w/api.php?` + new URLSearchParams({action:'query',format:'json',formatversion:'2',origin:'*',prop:'imageinfo',iiprop:'extmetadata',iiextmetadatafilter:'Artist|LicenseShortName',titles:'File:'+f});
    const j = await fetch(u).then(r=>r.json()); const m = j.query.pages[0].imageinfo?.[0]?.extmetadata || {};
    const who = (m.Artist?.value||'').replace(/<[^>]+>/g,'').trim(); const lic = m.LicenseShortName?.value || '';
    const c = req===infoReq && $('#credit'); if (c && (who||lic)) c.textContent = `Photo: ${who||'Wikimedia Commons'}${lic?` · ${lic}`:''}`;
  } catch {}
}
function closeInfo(){ hide($('#info')); if (!isOpen($('#sheet'))) hide($('#scrim')); }

/* editors can fix a match */
function openInfoEdit(kind, key){
  const rec = INFO[kind]?.[key] || {};
  let historyBtn = '';
  if (mode === 'netlify') historyBtn = `<button type="button" data-history="${esc(kind)}" data-key="${esc(key)}">History</button>`;
  closeInfo();
  openSheet(`<h3>Edit info</h3><form id="frm">
    <p class="hint" style="font-size:14px">${esc(kind==='artists'?key:key.replace('|',', '))}</p>
    <label for="f-wiki">Wikipedia page<input id="f-wiki" value="${esc(rec.wiki||'')}" placeholder="e.g. Phoenix (French band)"><span class="hint">Paste a page title or a Wikipedia link, then Look up.</span></label>
    <div class="foot" style="margin-top:0"><button type="button" id="lookup">Look up</button><span id="lookMsg" class="hint"></span></div>
    <label for="f-desc">Short description<input id="f-desc" value="${esc(rec.desc||'')}"></label>
    <label for="f-img">Photo (Commons file name)<input id="f-img" value="${esc(rec.img||'')}" placeholder="File_name.jpg"></label>
    <label for="f-inote">Note<textarea id="f-inote" rows="2">${esc(rec.note||'')}</textarea></label>
    <div class="foot"><button class="primary" type="submit">Save</button><button type="button" data-close>Cancel</button><span class="spacer"></span>${historyBtn}<button type="button" class="danger" id="unmatch">Remove match</button></div></form>`);
  let fetched = null;
  $('#lookup').onclick = async () => {
    let t = $('#f-wiki').value.trim().replace(/^https?:\/\/en\.(m\.)?wikipedia\.org\/wiki\//,''); t = decodeURIComponent(t).replace(/_/g,' ');
    if (!t) return; $('#lookMsg').textContent = 'Looking up…';
    try {
      const j = await fetch('https://en.wikipedia.org/w/api.php?'+new URLSearchParams({action:'query',format:'json',formatversion:'2',origin:'*',redirects:'1',prop:'description|pageprops|pageimages',ppprop:'wikibase_item|disambiguation',piprop:'name|thumbnail',pithumbsize:'100',titles:t})).then(r=>r.json());
      const p = j.query.pages[0];
      if (p.missing){ $('#lookMsg').textContent = 'No page with that title.'; return; }
      if (p.pageprops && 'disambiguation' in p.pageprops){ $('#lookMsg').textContent = 'That’s a disambiguation page. Pick the specific one.'; return; }
      fetched = {wiki:p.title, qid:p.pageprops?.wikibase_item, desc:p.description||'', img: p.pageimage ? p.pageimage.replace(/ /g,'_') + (p.thumbnail?.source?.includes('/wikipedia/en/')?'|en':'') : ''};
      $('#f-wiki').value = fetched.wiki; $('#f-desc').value = fetched.desc; $('#f-img').value = fetched.img;
      $('#lookMsg').textContent = `Found: ${fetched.wiki}`;
    } catch { $('#lookMsg').textContent = 'Wikipedia didn’t respond. Try again.'; }
  };
  $('#unmatch').onclick = async () => { INFO[kind][key] = null; if (await saveInfo(kind, key)){ closeSheet(); toast('Match removed'); } };
  $('#frm').addEventListener('submit', async e => { e.preventDefault();
    const wiki = $('#f-wiki').value.trim();
    let next = {...rec};
    if (fetched && fetched.qid !== rec.qid) next = {wiki:fetched.wiki, qid:fetched.qid};   // new page: drop old facts
    Object.assign(next, {wiki: wiki || undefined, desc: $('#f-desc').value.trim(), img: $('#f-img').value.trim() || undefined, note: $('#f-inote').value.trim() || undefined});
    INFO[kind] = INFO[kind] || {}; INFO[kind][key] = next.wiki || next.desc ? next : null;
    if (await saveInfo(kind, key)){ closeSheet(); toast('Info saved'); openInfo(kind, key); }
  });
}
function commit(msg, op){ closeSheet(); render(); persist(op); toast(msg); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.artist !== undefined) { openInfo('artists', t.dataset.artist, canEdit() ? t.dataset.id : null); return; }
  if (t.dataset.venue !== undefined) { openInfo('venues', t.dataset.venue); return; }
  if ('closeInfo' in t.dataset) { closeInfo(); return; }
  if (t.dataset.infoEdit) { openInfoEdit(t.dataset.infoEdit, t.dataset.key); return; }
  if (t.dataset.history !== undefined) { closeInfo(); openHistory(t.dataset.history, t.dataset.key); return; }
  if (t.dataset.historyMore) { t.disabled = true; openHistory(historyFor.table, historyFor.key, t.dataset.historyMore); return; }
  if (t.dataset.undo) { t.disabled = true; undoChange(t.dataset.undo); return; }
  if (t.dataset.edit) { closeInfo(); if (canEdit()) openEdit(t.dataset.edit); else { const a=shows.find(s=>s.id===t.dataset.edit); if(a){ $('#q').value=a.artist; filt.q=a.artist; filterList(); } } }
  else if (t.id==='btnAuth') { if (user) { idn.logout().finally(()=>{ user=null; applyAuth(); toast('Signed out'); }); } else openLogin(); }
  else if (t.dataset.addto) openAdd(shows.find(s=>s.id===t.dataset.addto));
  else if (t.dataset.bill) openBill(t.dataset.bill);
  else if ('close' in t.dataset) closeSheet();
  else if (t.dataset.q !== undefined){ closeInfo(); $('#q').value = t.dataset.q; filt.q = t.dataset.q; setView('log'); filterList(); window.scrollTo({top:0}); }
  else if (t.dataset.view){ setView(t.dataset.view); }
  else if (t.id==='moreBtn'){ showAllMost=!showAllMost; renderStats(); }
  else if (t.dataset.type !== undefined){ filt.type = t.dataset.type; document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed', b===t)); filterList(); }
});
$('#scrim').onclick = () => { closeSheet(); closeInfo(); };
document.addEventListener('keydown', e => { if (e.key==='Escape') { if (isOpen($('#sheet'))) closeSheet(); else if (isOpen($('#info'))) closeInfo(); } });
$('#q').addEventListener('input', e => { filt.q = e.target.value.trim(); filterList(); });
document.addEventListener('change', e => { if (e.target.id==='f-move' && e.target.value){ store.set('show-log-move', e.target.value); renderStatsView(); } });
$('#city').addEventListener('change', e => { filt.city = e.target.value; filterList(); });
$('#btnAdd').onclick = () => openAdd(null);
$('#btnData').onclick = openData;

load().then(async () => { if (mode==='netlify') await initIdentity(); await loadInfo(); render(); applyAuth(); if (location.hash==='#stats') setView('stats'); if (mode!=='netlify') setState('Saved in this browser'); });
})();
</script>

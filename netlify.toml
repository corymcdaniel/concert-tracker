[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  framework = "#custom"
  command = "npx astro dev"
  targetPort = 4321

[functions]
  node_bundler = "esbuild"

# Keep the whole site, including the JSON data files, out of search results
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Built files have a content hash in their names, so a changed file always gets a new name:
# browsers can keep them for a year instead of checking back on every visit
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

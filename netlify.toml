[build]
  publish = "."
  functions = "netlify/functions"
  # No build command needed: index.html is static and vendor/identity.js is prebuilt.

[functions]
  node_bundler = "esbuild"

# Keep the source/config files out of the public site
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

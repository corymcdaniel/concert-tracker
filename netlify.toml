[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  framework = "#custom"
  command = "npx astro dev"
  targetPort = 4321

[functions]
  node_bundler = "esbuild"

# Keep the whole site, including the JSON data files, out of search results
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
